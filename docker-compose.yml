version: '3.8'

services:
  # 1. Database Service
  database:
    image: postgres:15-alpine
    container_name: database
    environment:
      POSTGRES_DB: ${DB_NAME:-saas_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Backend API Service
  backend:
    build: ./backend
    container_name: backend
    ports:
      - "5000:5000"
    environment:
      - PORT=${PORT:-5000}
      - DB_HOST=database
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-saas_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      - SEED_SUPER_ADMIN_PASSWORD=${SEED_SUPER_ADMIN_PASSWORD:?Set seed passwords in the root .env file}
      - SEED_TENANT_ADMIN_PASSWORD=${SEED_TENANT_ADMIN_PASSWORD:?Set seed passwords in the root .env file}
      - SEED_USER_PASSWORD=${SEED_USER_PASSWORD:?Set seed passwords in the root .env file}
      # Requirement: Use service name for internal Docker communication
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      # This ensures the backend is actually running and connected to DB
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./backend:/app
      - /app/node_modules

  # 3. Frontend Service
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      # Browser needs to hit localhost because it runs on the host machine
      - REACT_APP_API_URL=http://localhost:5000/api
    depends_on:
      backend:
        condition: service_healthy
    stdin_open: true
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  db_data: